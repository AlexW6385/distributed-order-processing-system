# Single-node Postgres, Redis and Kafka for development and CI. Production
# would use managed or operator-run equivalents.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init-databases.sql: |
    CREATE DATABASE products;
    CREATE DATABASE orders;
    CREATE DATABASE payments;
    CREATE DATABASE notifications;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=300"]
          env:
            - {name: POSTGRES_USER, value: orders}
            - {name: POSTGRES_PASSWORD, value: orders}
            - {name: POSTGRES_DB, value: postgres}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: {command: [pg_isready, -U, orders]}
            periodSeconds: 5
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - port: 9092
---
# Fault injection between order-service and its dependencies. With no
# toxics configured it passes traffic through unchanged.
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy-config
data:
  toxiproxy.json: |
    [
      {"name": "product", "listen": "0.0.0.0:21052", "upstream": "product-service:50052", "enabled": true},
      {"name": "payment", "listen": "0.0.0.0:21053", "upstream": "payment-service:50053", "enabled": true}
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
spec:
  selector:
    matchLabels: {app: toxiproxy}
  template:
    metadata:
      labels: {app: toxiproxy}
    spec:
      enableServiceLinks: false
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.9.0
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - {name: api, containerPort: 8474}
            - {name: product, containerPort: 21052}
            - {name: payment, containerPort: 21053}
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          configMap: {name: toxiproxy-config}
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
spec:
  selector: {app: toxiproxy}
  ports:
    - {name: api, port: 8474}
    - {name: product, port: 21052}
    - {name: payment, port: 21053}
