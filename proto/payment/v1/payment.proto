syntax = "proto3";

package payment.v1;

option go_package = "github.com/AlexW6385/distributed-order-processing-system/gen/payment/v1;paymentv1";

service PaymentService {
  // Charge charges an order at most once. The order ID is the idempotency
  // key: calling Charge again for the same order returns the original result,
  // so callers can retry safely after a timeout.
  rpc Charge(ChargeRequest) returns (ChargeResponse);
}

message ChargeRequest {
  string order_id = 1;
  int64 amount_cents = 2;
  // idempotency_key is the client's key, stored for traceability.
  string idempotency_key = 3;
}

message ChargeResponse {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_cents = 3;
  // status is "succeeded" or "declined". A decline is a definite answer, not
  // an error.
  string status = 4;
  string decline_reason = 5;
}
