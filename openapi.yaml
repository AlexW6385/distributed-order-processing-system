openapi: 3.0.3
info:
  title: Distributed Order Processing System API
  version: 3.0.0
  description: |
    Public HTTP API served by api-gateway. Every response carries an
    X-Trace-Id header: the OpenTelemetry trace of the request, viewable in
    Jaeger. Requests are rate limited per client IP (429 when exceeded).

    503 means a dependency is unavailable and the request had no effect (for
    example, the payment circuit breaker is open); it is safe to retry.
    202 means the outcome is not known yet and will settle in the background.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness and readiness probe
      responses:
        "200":
          description: Gateway is running
  /products:
    get:
      summary: List products and available stock
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
  /orders:
    post:
      summary: Create an order and reserve its stock
      description: |
        With an Idempotency-Key, retrying the same request returns the order the
        first request created instead of creating another one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created with stock reserved (or the replayed order)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Stock could not be reserved (insufficient stock, flash sale sold out or limit reached)
        "503":
          description: A dependency was unavailable; the order was failed and can be retried with a new key
  /orders/{order_id}:
    get:
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          $ref: "#/components/responses/Error"
  /orders/{order_id}/pay:
    post:
      summary: Pay a reserved order
      description: |
        Safe to retry. Concurrent calls for one order charge it once.
        Returns 202 with status payment_pending when the payment outcome is not
        known yet; the order settles in the background, so poll
        GET /orders/{order_id}.
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment settled; status is paid or failed (declined)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "202":
          description: Payment outcome unknown; status is payment_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Order cannot be paid (cancelled, expired, failed, or past its payment window)
        "503":
          description: Payment service unavailable; nothing was charged and the order can be paid again
  /orders/{order_id}/refund:
    post:
      summary: Refund a paid order in full and return its stock
      description: |
        Safe to retry; refunds at most once. Returns 202 with status
        refund_pending while the outcome is unknown.
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "202":
          description: Refund outcome unknown; status is refund_pending
        "409":
          description: Order is not paid
        "503":
          description: Payment service unavailable; nothing was refunded
  /admin/flash-sales:
    post:
      summary: Start a flash sale for a product
      description: |
        Sets the product's stock and puts it behind the Redis admission gate:
        one unit per customer, and requests beyond the stock are rejected in
        Redis without reaching Postgres. Unauthenticated (development only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, stock]
              properties:
                product_id: {type: string, example: prod-headphones-014}
                stock: {type: integer, minimum: 1, example: 100}
      responses:
        "200":
          description: Sale started
  /orders/{order_id}/cancel:
    post:
      summary: Cancel a reserved order that has not started payment
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: Order cancelled; its stock is released asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Order is not in a cancellable state
components:
  parameters:
    OrderID:
      name: order_id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    Product:
      type: object
      properties:
        id: { type: string, example: prod-coffee-001 }
        name: { type: string }
        description: { type: string }
        price_cents: { type: integer }
        stock: { type: integer }
    CreateOrderRequest:
      type: object
      required: [customer_email, items]
      properties:
        customer_email:
          type: string
          example: alex@example.com
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                example: prod-coffee-001
              quantity:
                type: integer
                minimum: 1
                example: 2
    OrderResponse:
      type: object
      properties:
        order:
          $ref: "#/components/schemas/Order"
    Order:
      type: object
      properties:
        id: { type: string }
        customer_email: { type: string }
        status:
          type: string
          enum: [pending, stock_reserved, payment_pending, paid, failed, expired, cancelled, refund_pending, refunded]
        total_cents: { type: integer }
        failure_reason: { type: string }
        expires_at:
          type: string
          format: date-time
          description: Payment deadline for a reserved order
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              product_name: { type: string }
              quantity: { type: integer }
              unit_price_cents: { type: integer }
              subtotal_cents: { type: integer }
