apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels: {app: payment-service}
spec:
  replicas: 2
  selector:
    matchLabels: {app: payment-service}
  template:
    metadata:
      labels: {app: payment-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      containers:
        - name: payment-service
          image: order-system:dev
          command: [payment-service]
          imagePullPolicy: IfNotPresent
          ports:
            - {name: grpc, containerPort: 50053}
            - {name: metrics, containerPort: 9090}
          envFrom:
            - configMapRef: {name: order-system-config}
          env:
          - name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: order-system-db, key: payment-service}}
          readinessProbe:
            grpc: {port: 50053}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 50053}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  clusterIP: None   # headless: clients resolve every pod and balance round-robin
  selector: {app: payment-service}
  ports:
    - {name: grpc, port: 50053}
