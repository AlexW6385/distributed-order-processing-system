syntax = "proto3";

package order.v1;

option go_package = "github.com/AlexW6385/distributed-order-processing-system/gen/order/v1;orderv1";

service OrderService {
  // CreateOrder creates an order and reserves stock for it. Replaying a
  // request with the same idempotency_key returns the original order.
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
  // PayOrder charges a reserved order. If the payment outcome is not known
  // yet, the order is returned in status payment_pending and settles later.
  rpc PayOrder(PayOrderRequest) returns (OrderResponse);
  // CancelOrder cancels an order that has stock reserved but is not paid.
  rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
  // RefundOrder refunds a paid order in full and returns its stock. Like
  // PayOrder it may answer with status refund_pending and settle later.
  rpc RefundOrder(RefundOrderRequest) returns (OrderResponse);
  // ListOrders pages through orders by last update, oldest first. Used by
  // the reconciler.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

message OrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  int64 subtotal_cents = 5;
}

message Order {
  string id = 1;
  string customer_email = 2;
  string status = 3;
  int64 total_cents = 4;
  repeated OrderItem items = 5;
  string failure_reason = 6;
  string created_at = 7;
  string updated_at = 8;
  // expires_at is the payment deadline for a reserved order (RFC 3339).
  string expires_at = 9;
}

message CreateOrderRequest {
  string customer_email = 1;
  repeated OrderItemInput items = 2;
  string idempotency_key = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message PayOrderRequest {
  string order_id = 1;
  string idempotency_key = 2;
}

message CancelOrderRequest {
  string order_id = 1;
}

message RefundOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_page_token = 2;
}

message OrderResponse {
  Order order = 1;
}
