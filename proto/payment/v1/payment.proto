syntax = "proto3";

package payment.v1;

option go_package = "github.com/AlexW6385/distributed-order-processing-system/gen/payment/v1;paymentv1";

service PaymentService {
  // Charge charges an order at most once. The order ID is the idempotency
  // key: calling Charge again for the same order returns the original result,
  // so callers can retry safely after a timeout.
  rpc Charge(ChargeRequest) returns (ChargeResponse);
  // Refund refunds a successful charge in full, at most once per order.
  rpc Refund(RefundRequest) returns (RefundResponse);
  // ListPayments pages through payments in creation order. Used by the
  // reconciler.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  // GetLedgerSummary returns account balances from the double-entry ledger.
  rpc GetLedgerSummary(GetLedgerSummaryRequest) returns (LedgerSummary);
}

message ChargeRequest {
  string order_id = 1;
  int64 amount_cents = 2;
  // idempotency_key is the client's key, stored for traceability.
  string idempotency_key = 3;
}

message ChargeResponse {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_cents = 3;
  // status is "succeeded" or "declined". A decline is a definite answer, not
  // an error.
  string status = 4;
  string decline_reason = 5;
}

message RefundRequest {
  string order_id = 1;
  int64 amount_cents = 2;
}

message RefundResponse {
  string refund_id = 1;
  string order_id = 2;
  int64 amount_cents = 3;
}

message Payment {
  string payment_id = 1;
  string order_id = 2;
  int64 amount_cents = 3;
  string status = 4;
  bool refunded = 5;
}

message ListPaymentsRequest {
  string page_token = 1;
  int32 page_size = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_page_token = 2;
}

message GetLedgerSummaryRequest {}

message LedgerSummary {
  // Sum of every journal line; zero when the books balance.
  int64 total_cents = 1;
  int64 cash_cents = 2;
  int64 revenue_cents = 3;
  int64 charged_cents = 4;
  int64 refunded_cents = 5;
}
